<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>404 — Minhas Letras</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23000000'/%3E%3Ccircle cx='256' cy='256' r='152' fill='%23fafafa'/%3E%3Ctext x='256' y='320' font-family='Verdana' font-size='200' font-weight='800' text-anchor='middle' fill='%23000000'%3E%E2%99%AA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #000000;
      --bg-surface: #09090b;
      --bg-card: #18181b;
      --border: #27272a;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #fafafa;
      --on-accent: #09090b;
      --radius: 6px;
      --font: 'Google Sans Flex', 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--text-primary); }
    :focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }

    .erro404 {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    /* Código 404 grande */
    .codigo {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text-muted);
      user-select: none;
    }

    /* Título */
    .titulo {
      margin-top: 1.5rem;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      text-balance: balance;
    }

    /* Descrição */
    .descricao {
      margin-top: 0.8rem;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-secondary);
      text-balance: balance;
    }

    /* Botões */
    .botoes {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.4rem;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 550;
      font-family: var(--font);
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .btn-principal {
      background: var(--accent);
      color: var(--on-accent);
    }
    .btn-principal:hover { opacity: 0.88; }

    .btn-secundario {
      background: transparent;
      color: var(--text-primary);
      border-color: var(--border);
    }
    .btn-secundario:hover {
      background: var(--bg-card);
      border-color: #3f3f46;
    }

    /* Separador */
    .links-area {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .links-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .links {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      justify-content: center;
    }

    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.15s;
    }
    .links a:hover { color: var(--text-secondary); }
    .links a:hover .seta { transform: translateX(3px); }

    .seta {
      font-size: 0.85rem;
      transition: transform 0.15s;
      color: var(--text-muted);
    }

    /* Ícone musical decorativo */
    .icone-musica {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 1.5rem;
      margin-bottom: 1rem;
      user-select: none;
    }

    @media (max-width: 480px) {
      .botoes { flex-direction: column; align-items: stretch; }
      .btn { justify-content: center; }
      .links { flex-direction: column; align-items: center; gap: 0.75rem; }
    }
  </style>
</head>
<body>
  <main class="erro404">
    <div class="icone-musica" aria-hidden="true">♪</div>

    <div class="codigo" aria-label="Erro 404">404</div>

    <h1 class="titulo">Essa página não existe</h1>

    <p class="descricao">
      O link pode estar errado, a página foi movida, ou nunca existiu.
      Volta pro início ou escolhe uma das páginas abaixo.
    </p>

    <div class="botoes">
      <a href="/" class="btn btn-principal">Voltar pro início</a>
      <a href="guia-como-usar.pdf" target="_blank" rel="noopener" class="btn btn-secundario">Guia de uso</a>
    </div>

    <div class="links-area">
      <p class="links-label">Páginas do site</p>
      <nav class="links" aria-label="Links úteis">
        <a href="/">Início <span class="seta">→</span></a>
        <a href="guia-como-usar.html">Guia de uso <span class="seta">→</span></a>
        <a href="termos.html">Termos de Uso <span class="seta">→</span></a>
        <a href="privacidade.html">Privacidade <span class="seta">→</span></a>
        <a href="cookies.html">Cookies <span class="seta">→</span></a>
      </nav>
    </div>
  </main>
</body>
</html>
